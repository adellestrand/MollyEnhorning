<!doctype html><html lang="sv"><meta charset="utf-8"><title>Molly – browserkontroll</title><style>body{font:14px system-ui;background:#f4f0f7;color:#432d50;margin:20px}iframe{width:1024px;height:768px;border:1px solid #cdbfda}li{margin:6px}.pass{color:#326d43}.fail{color:#a21b35}</style><h1>Funktionell browserkontroll</h1><p>Deterministisk simulation med riktiga DOM-händelsehanterare. Flera pekningar emuleras; fysisk surfplatta ingår inte.</p><ol id="results"></ol><iframe src="../index.html?test=1&amp;v=1.1.1" title="Testspel i surfplattestorlek"></iframe><script>
const iframe=document.querySelector('iframe'),results=document.querySelector('#results');
const assert=(v,m)=>{if(!v)throw Error(m)};
iframe.addEventListener('load',async()=>{
const w=iframe.contentWindow,d=w.document;while(!w.MollyTest||!w.MollyTest.ready)await new Promise(r=>setTimeout(r,50));const t=w.MollyTest;
const key=(code,type='keydown')=>d.dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true,cancelable:true}));
const pointer=(action,id,type)=>d.querySelector('[data-action="'+action+'"]').dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',bubbles:true,cancelable:true}));
const screen=(x,id,type)=>{const c=d.querySelector('canvas'),r=c.getBoundingClientRect();c.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',clientX:r.left+x*r.width/1200,clientY:r.top+r.height*.7,bubbles:true,cancelable:true}));};
const test=(name,f)=>{const li=document.createElement('li');try{f();li.textContent='GODKÄNT – '+name;li.className='pass';}catch(e){li.textContent='FEL – '+name+': '+e.message;li.className='fail';}results.append(li)};
test('Spelbilder laddas, startknappen öppnar spel',()=>{d.querySelector('#play').click();t.step(40);assert(t.game.mode==='playing','Start');assert(d.querySelector('#overlay').hidden,'Overlay');assert(t.game.p.grounded,'Markkollision');});
test('Vänster/höger, släpp, inga A/D-kontroller',()=>{let x=t.game.p.x;key('ArrowRight');t.step(30);key('ArrowRight','keyup');assert(t.game.p.x>x+50,'Höger');x=t.game.p.x;t.step(20);assert(t.game.p.x===x,'Släpp');key('ArrowLeft');t.step(20);key('ArrowLeft','keyup');assert(t.game.p.x<x,'Vänster');x=t.game.p.x;key('KeyD');key('KeyA');t.step(20);assert(t.game.p.x===x,'A/D');});
test('Mellanslag hoppar, håller flygning och tömmer flygkraft',()=>{t.start();t.step(40);key('Space');t.step(220);assert(t.game.p.y<418,'Hopp');assert(t.game.p.fuel===0,'Begränsad flygning');key('Space','keyup');t.step(180);assert(t.game.p.grounded&&t.game.p.fuel===1.3,'Landning och påfyllning');});
test('X trollar bort törnen och återhämtar sig',()=>{t.start();t.step(40);t.game.p.x=450;key('KeyX');t.step(25);key('KeyX','keyup');assert(t.game.thorns[0].removed,'Törnen');assert(t.game.cooldown>0,'Återhämtning');});
test('Tre samtidiga pekningar: spelyta, flygning och magi',()=>{t.start();t.step(40);screen(500,11,'pointerdown');pointer('jump',12,'pointerdown');pointer('magic',13,'pointerdown');assert(t.input().right&&t.input().jump&&t.input().magic,'Samtidighet');const x=t.game.p.x;t.step(30);assert(t.game.p.x>x&&t.game.p.y<400,'Rörelse och hopp');pointer('jump',12,'pointerup');assert(t.input().right&&!t.input().jump,'Oberoende släpp');screen(500,11,'pointercancel');pointer('magic',13,'lostpointercapture');assert(!Object.values(t.input()).some(Boolean),'Avbryt');});
test('Två fingrar på samma knapp, fokusförlust rensar destination och knappar',()=>{t.start();t.step(40);screen(400,20,'pointerdown');pointer('jump',21,'pointerdown');pointer('jump',22,'pointerdown');t.step();pointer('jump',21,'pointerup');assert(t.input().jump,'Andra fingret kvar');w.dispatchEvent(new w.Event('blur'));assert(!Object.values(t.input()).some(Boolean),'Fokus');assert(t.game.mode==='paused','Automatisk paus');});
test('Paus och snabb omstart via synliga knappar',()=>{d.querySelector('#play').click();assert(t.game.mode==='playing','Fortsätt');d.querySelector('#pause').click();const x=t.game.p.x;t.step(30);assert(t.game.p.x===x&&t.game.mode==='paused','Paus');d.querySelector('#restart').click();assert(t.game.p.health===3&&t.game.collected===0&&t.game.mode==='playing','Omstart');});
test('Faror tar hälsa, förlust visas och försök igen fungerar',()=>{for(let i=0;i<3;i++){t.game.p.y=800;t.step();}assert(t.game.mode==='lost','Förlust');assert(!d.querySelector('#overlay').hidden,'Förlustdialog');d.querySelector('#play').click();assert(t.game.mode==='playing'&&t.game.p.health===3,'Nytt försök');});
test('Hela banan via tangentbordshändelser: stjärnor, raviner och mål',()=>{t.start();let prev={};for(let i=0;i<8000&&t.game.mode==='playing';i++){const p=t.game.p,need=[780,1800,2750].some(x=>p.x>x-140&&p.x<x+260);const inputs={ArrowRight:true,Space:need&&(!p.grounded||!t.game.jumpWas),KeyX:i%90===0};for(const [code,value] of Object.entries(inputs))if(value!==!!prev[code])key(code,value?'keydown':'keyup');prev=inputs;t.step();}for(const code of Object.keys(prev))key(code,'keyup');assert(t.game.mode==='won','Mål');assert(t.game.p.health===3,'Tre hjärtan');assert(t.game.collected>=5,'Stjärnor');assert(!d.querySelector('#overlay').hidden,'Vinstdialog');assert(d.querySelector('#dialog-text').textContent.includes('stjärnor'),'Svensk vinsttext');});
test('Liggande surfplatta: knappar under canvas, inga scrollområden',()=>{const c=d.querySelector('canvas').getBoundingClientRect();for(const b of d.querySelectorAll('[data-action],#stop')){if(!b.getClientRects().length)continue;const r=b.getBoundingClientRect();assert(r.top>=c.bottom,'Knapp över spelyta');assert(r.width>=44&&r.height>=44,'Träffyta');assert(w.getComputedStyle(b).touchAction==='none','touch-action');}assert(d.documentElement.scrollHeight<=w.innerHeight,'Vertikal scroll');assert(d.documentElement.scrollWidth<=w.innerWidth,'Horisontell scroll');});
test('Snabba hopp- och magitryck mellan två fysiksteg tappas inte',()=>{t.start();t.step(40);key('Space');key('Space','keyup');t.step();assert(t.game.p.vy<0,'Kort tangenttryck');t.start();t.step(40);pointer('magic',31,'pointerdown');pointer('magic',31,'pointerup');t.step();assert(t.game.shots.length===1,'Kort pektryck');assert(!t.input().magic,'Pektryck fastnar inte');t.start();t.step(40);pointer('jump',32,'pointerdown');pointer('jump',32,'pointercancel');t.step();assert(t.game.p.grounded,'Avbrutet tryck ska rensas');});
test('Pekning växlar gränssnitt och svenska instruktioner',()=>{assert(d.body.dataset.controls==='touch','Pekläge');assert(!d.querySelector('.directions').getClientRects().length,'Pilar dolda');assert(!d.querySelector('.abilities kbd').getClientRects().length,'Tangentlegend dold');assert(!d.querySelector('#touch-instructions').hidden,'Pekinstruktioner');assert(d.querySelector('#keyboard-instructions').hidden,'Tangentinstruktioner dolda');assert(d.querySelector('canvas').getAttribute('aria-label').includes('Släpp för att stanna'),'Spelytans instruktion');});
test('Håll rör Molly, släpp stoppar och ett nytt håll går tillbaka',()=>{t.start();t.step(40);const startX=t.game.p.x;screen(400,40,'pointerdown');t.step(30);assert(t.game.p.x>startX,'Rör sig medan fingret hålls');screen(400,40,'pointerup');screen(400,40,'lostpointercapture');assert(!t.input().right&&!t.input().left,'Ingen rörelse efter släpp');const x=t.game.p.x;t.step(180);assert(t.game.p.x===x&&t.game.p.vx===0,'Står still efter släpp');screen(50,41,'pointerdown');t.step(20);assert(t.game.p.x<x,'Nytt håll åt vänster');screen(50,41,'pointerup');const leftX=t.game.p.x;t.step(30);assert(t.game.p.x===leftX,'Vänster stannar vid släpp');});
test('Ett kort tryck mellan fysiksteg startar ingen promenad',()=>{t.start();t.step(40);const x=t.game.p.x;screen(400,42,'pointerdown');screen(400,42,'pointerup');t.step(180);assert(t.game.p.x===x,'Kort tryck ska inte fortsätta gå');});
test('Släpp rörelsefingret stoppar gång medan hopp och magi hålls',()=>{t.start();t.step(40);screen(500,43,'pointerdown');pointer('jump',44,'pointerdown');pointer('magic',45,'pointerdown');t.step(20);screen(500,43,'pointerup');assert(!t.input().right&&t.input().jump&&t.input().magic,'Knappar hålls oberoende');const x=t.game.p.x;t.step(30);assert(t.game.p.x===x&&t.game.p.y<400,'Stannar men fortsätter flyga');pointer('jump',44,'pointerup');pointer('magic',45,'pointerup');});
test('Ett annat finger på spelytan kan inte släppa rörelsefingret',()=>{t.start();t.step(40);screen(400,46,'pointerdown');screen(50,47,'pointerdown');screen(50,47,'pointerup');assert(t.input().right,'Det första fingret styr fortfarande');screen(400,46,'pointerup');assert(!t.input().right&&!t.input().left,'Rätt finger släpper rörelse');});
test('Dra ändrar destination, Stanna och avbrott rensar den',()=>{t.start();t.step(40);screen(400,50,'pointerdown');screen(50,50,'pointermove');assert(t.input().left,'Drag ändrar riktning');screen(50,50,'pointercancel');assert(!t.input().left&&!t.input().right,'Avbruten pekning');screen(400,51,'pointerdown');screen(400,51,'lostpointercapture');assert(!t.input().right,'Förlorad pekfångst');screen(400,52,'pointerdown');d.querySelector('#stop').click();assert(!t.input().right&&d.querySelector('#stop').disabled,'Stanna');});
test('Skalad spelyta använder kamerans världskoordinater',()=>{t.start();t.game.p.x=2200;t.game.thorns.forEach(x=>x.removed=true);t.step(40);const expected=t.game.camera+400-t.game.p.w/2;screen(400,60,'pointerdown');t.step(180);assert(Math.abs(t.game.p.x-expected)<3,'Destination med kamera');screen(400,60,'pointerup');});
test('Skada avbryter promenaden',()=>{t.start();t.step(40);screen(600,70,'pointerdown');t.step(240);assert(t.game.p.health===2,'Törnskada');assert(!t.input().right&&!t.input().left,'Ingen fortsatt promenad efter skada');});
test('Paus rensar destination och fortsatt spel står stilla',()=>{t.start();t.step(40);screen(400,80,'pointerdown');d.querySelector('#pause').click();assert(!t.input().right&&t.game.mode==='paused','Paus');d.querySelector('#play').click();const x=t.game.p.x;t.step(30);assert(t.game.p.x===x,'Fortsätt');});
test('Surfplattelayout i stående och liggande storlekar',()=>{for(const [width,height] of [[768,1024],[834,1194],[1024,600],[1366,1024]]){iframe.style.width=width+'px';iframe.style.height=height+'px';const c=d.querySelector('canvas').getBoundingClientRect();for(const b of d.querySelectorAll('#stop,.abilities button,#pause,#restart')){const r=b.getBoundingClientRect();assert(r.width>=44&&r.height>=44,'Träffyta '+width);assert(r.left>=0&&r.right<=width&&r.bottom<=height,'Synlig knapp '+width);if(b.closest('.controls'))assert(r.top>=c.bottom,'Knapp över canvas '+width);}assert(d.documentElement.scrollHeight<=height&&d.documentElement.scrollWidth<=width,'Scroll '+width);}iframe.style.width='1024px';iframe.style.height='768px';});
document.title=results.querySelector('.fail')?'Molly – TESTFEL':'Molly – ALLA BROWSERTESTER GODKÄNDA';
const preview=document.createElement('button');preview.textContent='Visa surfplattans spelvy';preview.addEventListener('click',()=>{document.querySelector('h1').hidden=true;document.querySelector('p').hidden=true;results.hidden=true;preview.hidden=true;document.body.style.margin='0';iframe.style.border='0';});results.before(preview);
});</script></html>
