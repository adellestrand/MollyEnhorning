<!doctype html><html lang="sv"><meta charset="utf-8"><title>Molly – browserkontroll</title><style>body{font:14px system-ui;background:#f4f0f7;color:#432d50;margin:20px}iframe{width:1024px;height:768px;border:1px solid #cdbfda}li{margin:6px}.pass{color:#326d43}.fail{color:#a21b35}</style><h1>Funktionell browserkontroll</h1><p>Deterministisk simulation med riktiga DOM-händelsehanterare. Flera pekningar emuleras; fysisk surfplatta ingår inte.</p><ol id="results"></ol><iframe src="../index.html?test=1&amp;v=1.0.1" title="Testspel i surfplattestorlek"></iframe><script>
const iframe=document.querySelector('iframe'),results=document.querySelector('#results');
const assert=(v,m)=>{if(!v)throw Error(m)};
iframe.addEventListener('load',async()=>{
const w=iframe.contentWindow,d=w.document;while(!w.MollyTest||!w.MollyTest.ready)await new Promise(r=>setTimeout(r,50));const t=w.MollyTest;
const key=(code,type='keydown')=>d.dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true,cancelable:true}));
const pointer=(action,id,type)=>d.querySelector('[data-action="'+action+'"]').dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',bubbles:true,cancelable:true}));
const test=(name,f)=>{const li=document.createElement('li');try{f();li.textContent='GODKÄNT – '+name;li.className='pass';}catch(e){li.textContent='FEL – '+name+': '+e.message;li.className='fail';}results.append(li)};
test('Spelbilder laddas, startknappen öppnar spel',()=>{d.querySelector('#play').click();t.step(40);assert(t.game.mode==='playing','Start');assert(d.querySelector('#overlay').hidden,'Overlay');assert(t.game.p.grounded,'Markkollision');});
test('Vänster/höger, släpp, inga A/D-kontroller',()=>{let x=t.game.p.x;key('ArrowRight');t.step(30);key('ArrowRight','keyup');assert(t.game.p.x>x+50,'Höger');x=t.game.p.x;t.step(20);assert(t.game.p.x===x,'Släpp');key('ArrowLeft');t.step(20);key('ArrowLeft','keyup');assert(t.game.p.x<x,'Vänster');x=t.game.p.x;key('KeyD');key('KeyA');t.step(20);assert(t.game.p.x===x,'A/D');});
test('Mellanslag hoppar, håller flygning och tömmer flygkraft',()=>{t.start();t.step(40);key('Space');t.step(220);assert(t.game.p.y<418,'Hopp');assert(t.game.p.fuel===0,'Begränsad flygning');key('Space','keyup');t.step(180);assert(t.game.p.grounded&&t.game.p.fuel===1.3,'Landning och påfyllning');});
test('X trollar bort törnen och återhämtar sig',()=>{t.start();t.step(40);t.game.p.x=450;key('KeyX');t.step(25);key('KeyX','keyup');assert(t.game.thorns[0].removed,'Törnen');assert(t.game.cooldown>0,'Återhämtning');});
test('Tre samtidiga pekningar: rörelse, flygning och magi',()=>{t.start();t.step(40);pointer('right',11,'pointerdown');pointer('jump',12,'pointerdown');pointer('magic',13,'pointerdown');assert(t.input().right&&t.input().jump&&t.input().magic,'Samtidighet');const x=t.game.p.x;t.step(30);assert(t.game.p.x>x&&t.game.p.y<400,'Rörelse och hopp');pointer('jump',12,'pointerup');assert(t.input().right&&!t.input().jump,'Oberoende släpp');pointer('right',11,'pointercancel');pointer('magic',13,'lostpointercapture');assert(!Object.values(t.input()).some(Boolean),'Avbryt');});
test('Två fingrar på samma knapp, fokusförlust rensar allt',()=>{t.start();pointer('right',21,'pointerdown');pointer('right',22,'pointerdown');pointer('right',21,'pointerup');assert(t.input().right,'Andra fingret kvar');key('Space');w.dispatchEvent(new w.Event('blur'));assert(!Object.values(t.input()).some(Boolean),'Fokus');assert(t.game.mode==='paused','Automatisk paus');});
test('Paus och snabb omstart via synliga knappar',()=>{d.querySelector('#play').click();assert(t.game.mode==='playing','Fortsätt');d.querySelector('#pause').click();const x=t.game.p.x;t.step(30);assert(t.game.p.x===x&&t.game.mode==='paused','Paus');d.querySelector('#restart').click();assert(t.game.p.health===3&&t.game.collected===0&&t.game.mode==='playing','Omstart');});
test('Faror tar hälsa, förlust visas och försök igen fungerar',()=>{for(let i=0;i<3;i++){t.game.p.y=800;t.step();}assert(t.game.mode==='lost','Förlust');assert(!d.querySelector('#overlay').hidden,'Förlustdialog');d.querySelector('#play').click();assert(t.game.mode==='playing'&&t.game.p.health===3,'Nytt försök');});
test('Hela banan via tangentbordshändelser: stjärnor, raviner och mål',()=>{t.start();let prev={};for(let i=0;i<8000&&t.game.mode==='playing';i++){const p=t.game.p,need=[780,1800,2750].some(x=>p.x>x-140&&p.x<x+260);const inputs={ArrowRight:true,Space:need&&(!p.grounded||!t.game.jumpWas),KeyX:i%90===0};for(const [code,value] of Object.entries(inputs))if(value!==!!prev[code])key(code,value?'keydown':'keyup');prev=inputs;t.step();}for(const code of Object.keys(prev))key(code,'keyup');assert(t.game.mode==='won','Mål');assert(t.game.p.health===3,'Tre hjärtan');assert(t.game.collected>=5,'Stjärnor');assert(!d.querySelector('#overlay').hidden,'Vinstdialog');assert(d.querySelector('#dialog-text').textContent.includes('stjärnor'),'Svensk vinsttext');});
test('Liggande surfplatta: knappar under canvas, inga scrollområden',()=>{const c=d.querySelector('canvas').getBoundingClientRect();for(const b of d.querySelectorAll('[data-action]')){const r=b.getBoundingClientRect();assert(r.top>=c.bottom,'Knapp över spelyta');assert(r.width>=44&&r.height>=44,'Träffyta');assert(w.getComputedStyle(b).touchAction==='none','touch-action');}assert(d.documentElement.scrollHeight<=w.innerHeight,'Vertikal scroll');assert(d.documentElement.scrollWidth<=w.innerWidth,'Horisontell scroll');});
test('Snabba hopp- och magitryck mellan två fysiksteg tappas inte',()=>{t.start();t.step(40);key('Space');key('Space','keyup');t.step();assert(t.game.p.vy<0,'Kort tangenttryck');t.start();t.step(40);pointer('magic',31,'pointerdown');pointer('magic',31,'pointerup');t.step();assert(t.game.shots.length===1,'Kort pektryck');assert(!t.input().magic,'Pektryck fastnar inte');t.start();t.step(40);pointer('jump',32,'pointerdown');pointer('jump',32,'pointercancel');t.step();assert(t.game.p.grounded,'Avbrutet tryck ska rensas');});
document.title=results.querySelector('.fail')?'Molly – TESTFEL':'Molly – ALLA BROWSERTESTER GODKÄNDA';
});</script></html>
